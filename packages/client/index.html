<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>泡泡堂</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- 大厅 -->
    <section id="screen-lobby" class="screen hidden">
      <div id="lobby-card">
        <div id="logo">💣 泡泡堂</div>
        <p id="lobby-sub">和好友来一局经典炸弹人</p>
        <input id="nickname" maxlength="12" placeholder="输入昵称" />
        <button id="btn-quick2" class="btn primary">⚡ 快速匹配 · 2人</button>
        <button id="btn-quick4" class="btn primary">⚡ 快速匹配 · 4人</button>
        <button id="btn-adventure" class="btn adventure">🗺 冒险模式 · 5人（人机补位）</button>
        <div class="divider"><span>或</span></div>
        <button id="btn-create" class="btn">🏠 创建房间</button>
        <div class="row">
          <input id="room-code" maxlength="4" placeholder="房间号" />
          <button id="btn-join" class="btn">加入</button>
        </div>
        <button id="btn-local" class="btn ghost">🎮 单机练习（无需等待）</button>
        <p id="lobby-status"></p>
      </div>
    </section>

    <!-- 游戏 -->
    <section id="screen-game" class="screen hidden">
      <div id="hud"></div>
      <div id="canvas-wrap">
        <canvas id="game"></canvas>
        <div id="overlay" class="hidden"></div>
      </div>
      <div id="players-panel"></div>
      <div id="toast" class="hidden"></div>
      <div id="shop-panel" class="hidden"></div>
      <p id="hint">方向键 / WASD 移动 · 空格放泡泡 · J 使用武器 · B 商城</p>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script type="module">
    // 开发缓存救急：内嵌浏览器无视缓存头，先注册 SW 强制全新加载
    if (location.port === "5173" && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
