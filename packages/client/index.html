<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>泡泡堂</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- 大厅 -->
    <section id="screen-lobby" class="screen hidden">
      <div class="lobby-scene" aria-hidden="true"><span class="sun-orb"></span><span class="hill hill-a"></span><span class="hill hill-b"></span><span class="firefly f1"></span><span class="firefly f2"></span><span class="firefly f3"></span></div>
      <div id="lobby-card">
        <header class="lobby-top"><div class="avatar">🌱</div><div class="profile"><strong id="profile-name">冒险旅人</strong><span>准备出发</span></div><button class="icon-btn" id="btn-settings" type="button" title="设置">⚙</button></header>
        <section class="lobby-hero"><div class="world-mark"><span class="world-bubble">✦</span><span>阳光花园 · 今日开放</span></div><div id="logo">泡泡堂</div>
        <p id="lobby-sub">收集阳光，穿过花田，和伙伴一起守护花园</p>
        <input id="nickname" maxlength="12" placeholder="输入昵称" />
        <button id="btn-adventure" class="btn adventure hero-action"><b>开始冒险</b><span>组队探索 · 人机伙伴 · 立即出发</span></button></section>
        <div class="lobby-quick"><span class="section-label">快速出发</span><div class="quick-actions"><button id="btn-quick2" class="btn primary">⚡ 双人匹配</button><button id="btn-quick4" class="btn primary">⚡ 四人匹配</button></div></div>
        <div class="divider"><span>或</span></div>
        <div class="row create-row">
          <button id="btn-create" class="btn">🏠 创建2人房间</button>
          <button id="btn-create4" class="btn">创建4人</button>
        </div>
        <div class="row">
          <input id="room-code" maxlength="4" placeholder="房间号" />
          <button id="btn-join" class="btn">加入</button>
        </div>
        <button id="btn-local" class="link-btn">🎮 单机练习</button><button id="btn-daily" class="link-btn">🎁 每日任务</button>
        <p id="lobby-status"></p>
      </div>
    </section>

    <!-- 游戏 -->
    <section id="screen-game" class="screen hidden">
      <div id="hud"></div>
      <div id="canvas-wrap">
        <canvas id="game"></canvas>
        <div id="overlay" class="hidden"></div>
      </div>
      <div id="players-panel"></div>
      <div id="toast" class="hidden"></div>
      <div id="shop-panel" class="hidden"></div>
      <p id="hint">方向键 / WASD 移动 · 空格放泡泡 · J 使用武器 · B 商城</p>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script type="module">
    // 开发缓存救急：内嵌浏览器无视缓存头，先注册 SW 强制全新加载
    if (location.port === "5173" && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
