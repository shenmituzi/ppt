# 泡泡堂站点配置：静态客户端 + WebSocket 反向代理
# 放到 /etc/nginx/sites-available/paopaotang 并软链到 sites-enabled

server {
    listen 80;
    server_name _;  # 有域名后改成你的域名，例如 paopaotang.example.com

    # 游戏客户端（vite build 产物）
    root /opt/paopaotang/packages/client/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # 游戏服务器 WebSocket（长连接需要 Upgrade 头）
    location /ws {
        proxy_pass http://127.0.0.1:2567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# 申请证书后（certbot --nginx -d 你的域名）会自动补上 443 的 wss 配置
